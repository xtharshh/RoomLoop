[project]
name = "roomloop"
version = "1.0.0"
description = "Booking core for the internal meeting-room service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1.0",
  "uvicorn[standard]>=0.27,<1.0",
  "tzdata>=2024.1",  # Windows / slim images ship no IANA database
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
roomloop-seed = "roomloop.seed:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
    "E501",  # formatted for review, not a column limit
    "B008",  # FastAPI dependency defaults are function calls by design
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["roomloop*"]

[tool.setuptools.package-data]
roomloop = ["static/*"]
