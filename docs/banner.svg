<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="RoomLoop — booking core for meeting rooms">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.55" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="pillA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0.30"/>
    </linearGradient>
    <linearGradient id="pillB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.46"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0.30"/>
    </linearGradient>
    <linearGradient id="pillC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0.26"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ambient background -->
  <rect width="1280" height="320" fill="#070a12"/>
  <ellipse cx="170" cy="-40" rx="420" ry="300" fill="url(#glowA)"/>
  <ellipse cx="1130" cy="-70" rx="440" ry="320" fill="url(#glowB)"/>
  <g stroke="#ffffff" stroke-opacity="0.035" stroke-width="1">
    <path d="M0 40h1280M0 120h1280M0 200h1280M0 280h1280"/>
    <path d="M160 0v320M400 0v320M640 0v320M880 0v320M1120 0v320"/>
  </g>

  <!-- brand mark -->
  <g transform="translate(64 92)">
    <rect x="0" y="0" width="76" height="76" rx="22" fill="#0b1020" stroke="url(#brand)" stroke-width="2" stroke-opacity="0.85"/>
    <g transform="translate(0 0) scale(2.375)" fill="none" stroke-linecap="round">
      <path d="M11 21.5V12.5a5 5 0 0 1 10 0v9" stroke="url(#brand)" stroke-width="2.1"/>
      <circle cx="11" cy="21.6" r="2.1" fill="#22d3ee" stroke="none"/>
      <circle cx="21" cy="21.6" r="2.1" fill="#a78bfa" stroke="none"/>
    </g>
  </g>

  <!-- wordmark -->
  <text x="168" y="132" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="48" font-weight="700" letter-spacing="-1.4" fill="#f2f5ff">RoomLoop</text>
  <text x="170" y="168" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="16.5" fill="#8b97ad">Meeting-room bookings, correct across DST.</text>

  <!-- capability chips -->
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5">
    <g transform="translate(64 214)">
      <rect width="116" height="28" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="16" y="19" fill="#c7d3e8">Berlin + Denver</text>
    </g>
    <g transform="translate(188 214)">
      <rect width="140" height="28" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="16" y="19" fill="#c7d3e8">weekly wall clock</text>
    </g>
    <g transform="translate(350 214)">
      <rect width="118" height="28" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="16" y="19" fill="#c7d3e8">DST-safe</text>
    </g>
    <g transform="translate(480 214)">
      <rect width="150" height="28" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="16" y="19" fill="#c7d3e8">92 tests</text>
    </g>
  </g>

  <!-- console illustration -->
  <g>
    <rect x="690" y="52" width="530" height="216" rx="20" fill="#0b101c" fill-opacity="0.92" stroke="#ffffff" stroke-opacity="0.10"/>
    <text x="714" y="82" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace"
          font-size="11.5" fill="#7c879e">TUESDAY · 08:00 — 19:00 · BERLIN</text>

    <!-- hour guides -->
    <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="1">
      <path d="M780 96v152M860 96v152M940 96v152M1020 96v152M1100 96v152M1180 96v152"/>
    </g>

    <!-- row 1 -->
    <text x="714" y="122" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6b768d">01 Aurora</text>
    <rect x="790" y="108" width="118" height="26" rx="7" fill="url(#pillA)" stroke="#67e8f9" stroke-opacity="0.45"/>
    <rect x="930" y="108" width="74" height="26" rx="7" fill="url(#pillB)" stroke="#a78bfa" stroke-opacity="0.45"/>

    <!-- row 2 -->
    <text x="714" y="170" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6b768d">02 Basalt</text>
    <rect x="856" y="156" width="96" height="26" rx="7" fill="url(#pillB)" stroke="#a78bfa" stroke-opacity="0.5"/>
    <text x="866" y="173" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#e6ddff">↻ series</text>
    <rect x="1010" y="156" width="118" height="26" rx="7" fill="url(#pillA)" stroke="#67e8f9" stroke-opacity="0.4"/>

    <!-- row 3 -->
    <text x="714" y="218" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#6b768d">03 Cinder</text>
    <rect x="946" y="204" width="140" height="26" rx="7" fill="url(#pillC)" stroke="#34d399" stroke-opacity="0.45"/>

    <!-- now line -->
    <path d="M1124 96v152" stroke="#fb7185" stroke-opacity="0.75" stroke-width="1.6"/>
    <circle cx="1124" cy="96" r="3.4" fill="#fb7185"/>

    <!-- office divider labels -->
    <text x="714" y="248" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#5d677c">08:00</text>
    <text x="1150" y="248" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#5d677c">19:00</text>
  </g>
</svg>
